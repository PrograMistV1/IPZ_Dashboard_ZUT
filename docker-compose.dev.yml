version: "3.9"

services:
  backend:
    volumes:
      - ./src:/app/src
    command: uvicorn src.back.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    volumes:
      - ./src/front:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_URL: http://backend:8000